services:
  devops:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: truvis-devops:latest
    container_name: truvis-devops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
