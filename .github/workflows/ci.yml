name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          if [ -f docker/docker-compose.yml ]; then
            docker compose -f docker/docker-compose.yml config
          else
            echo "No docker-compose.yml found, skipping."
          fi

      - name: Check shell scripts
        run: |
          find scripts -name "*.sh" -exec bash -n {} \;

  gate-scripts:
    name: Gate Scripts
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: check:foundations
        run: npm run check:foundations
        continue-on-error: true  # template repo lacks prisma/schema.prisma — expected INCOMPLETE

      - name: check:architect-triggers
        run: npm run check:architect-triggers
        continue-on-error: true  # triggers may fire on template files — informational in this repo

      - name: lint:migrations
        run: npm run lint:migrations

      - name: check:env (informational)
        run: npm run check:env
        continue-on-error: true  # placeholder values expected in CI without secrets

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: truvis-devops:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
